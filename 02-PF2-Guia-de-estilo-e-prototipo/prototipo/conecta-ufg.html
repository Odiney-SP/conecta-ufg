<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Conecta UFG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,600&display=swap">
<style>
/* Layout: app de estudante. Barra branca no topo com abas em pílula, conteúdo central
   de até 1100px, herói azul-cobalto com um ipê amarelo na página inicial, folha lateral
   (desktop) ou folha inferior (celular) para os detalhes, e barra de abas embaixo no celular. */
:root{
  --fundo:#F2F3F9; --cartao:#FFFFFF; --cartao-2:#E9EBF6; --linha:#DCDFEE;
  --tinta:#15173A; --tinta-2:#474B72; --tinta-3:#72769B;
  --marca:#2A3CD4; --marca-forte:#1D2CA8; --marca-suave:#E2E6FF; --sobre-marca:#FFFFFF;
  --heroi:#2A3CD4; --heroi-tx:#FFFFFF; --heroi-2:#C9D0FF;
  --ipe:#FFC21A; --ipe-suave:#FFF1C7; --ipe-tinta:#7A5500;
  --ok:#0C8657; --ok-suave:#DAF4E8;
  --aviso:#A85200; --aviso-suave:#FFE9D2;
  --erro:#CC2936; --erro-suave:#FDE3E5;
  --veu:rgba(21,23,58,.45);
  --texto:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --r:20px; --r-m:14px; --r-p:10px;
  --sombra:0 1px 2px rgba(21,23,58,.05),0 6px 18px rgba(21,23,58,.07);
  --sombra-forte:0 18px 50px rgba(21,23,58,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fundo:#0D0F21; --cartao:#171A34; --cartao-2:#21254A; --linha:#2B2F57;
  --tinta:#ECEDFF; --tinta-2:#B3B7DA; --tinta-3:#8488AE;
  --marca:#8F9DFF; --marca-forte:#AEB8FF; --marca-suave:#252C6B; --sobre-marca:#0D0F21;
  --heroi:#232B78; --heroi-tx:#FFFFFF; --heroi-2:#B9C1FF;
  --ipe:#FFCD45; --ipe-suave:#3A2E0B; --ipe-tinta:#FFD568;
  --ok:#4BD29A; --ok-suave:#0F2D22;
  --aviso:#FFA759; --aviso-suave:#3A2410;
  --erro:#FF7C86; --erro-suave:#3A1519;
  --veu:rgba(0,0,0,.6);
  --sombra:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);
  --sombra-forte:0 18px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --fundo:#0D0F21; --cartao:#171A34; --cartao-2:#21254A; --linha:#2B2F57;
  --tinta:#ECEDFF; --tinta-2:#B3B7DA; --tinta-3:#8488AE;
  --marca:#8F9DFF; --marca-forte:#AEB8FF; --marca-suave:#252C6B; --sobre-marca:#0D0F21;
  --heroi:#232B78; --heroi-tx:#FFFFFF; --heroi-2:#B9C1FF;
  --ipe:#FFCD45; --ipe-suave:#3A2E0B; --ipe-tinta:#FFD568;
  --ok:#4BD29A; --ok-suave:#0F2D22;
  --aviso:#FFA759; --aviso-suave:#3A2410;
  --erro:#FF7C86; --erro-suave:#3A1519;
  --veu:rgba(0,0,0,.6);
  --sombra:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);
  --sombra-forte:0 18px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--fundo);color:var(--tinta);font-family:var(--texto);
  font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,h4,p,ul,ol,dl,figure{margin:0}
ul{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--marca)}
:focus-visible{outline:3px solid var(--marca);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.pular{position:absolute;left:12px;top:-60px;z-index:99;background:var(--marca);color:var(--sobre-marca);
  padding:10px 18px;border-radius:999px;font-weight:800;transition:top .15s}
.pular:focus{top:12px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- barra do app ---------- */
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--cartao);
  border-bottom:1px solid var(--linha)}
.barra-in{max-width:1140px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.marca{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--tinta);flex:none;
  background:none;border:0;cursor:pointer;padding:4px;border-radius:12px}
.marca .selo{width:34px;height:34px;border-radius:11px;background:var(--marca);display:grid;place-items:center;
  position:relative}
.marca .selo::after{content:"";position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;
  background:var(--ipe);border:2.5px solid var(--cartao)}
.marca b{font-size:19px;font-weight:900;letter-spacing:-.02em;line-height:1}
.marca small{font-size:12px;font-weight:800;color:var(--marca);margin-left:2px}
.abas{display:flex;gap:4px;flex-wrap:wrap}
.abas a{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;text-decoration:none;
  color:var(--tinta-2);font-weight:700;font-size:14.5px;transition:background .15s,color .15s;position:relative}
.abas a:hover{background:var(--cartao-2);color:var(--tinta)}
.abas a[aria-current="page"]{background:var(--marca-suave);color:var(--marca)}
.barra-dir{margin-left:auto;display:flex;align-items:center;gap:8px}
.papel{display:flex;background:var(--cartao-2);border-radius:999px;padding:3px}
.papel button{border:0;background:none;padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px;
  color:var(--tinta-2);cursor:pointer;white-space:nowrap}
.papel button[aria-pressed="true"]{background:var(--cartao);color:var(--tinta);box-shadow:var(--sombra)}
.ico-btn{width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:50%;border:0;
  background:var(--cartao-2);color:var(--tinta-2);cursor:pointer;position:relative;flex:none}
.ico-btn:hover{color:var(--tinta);background:var(--linha)}
.ico-btn .bolha{position:absolute;top:-2px;right:-2px;min-width:19px;height:19px;border-radius:999px;
  background:var(--erro);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;
  padding:0 5px;border:2px solid var(--cartao)}
.avatar-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--ipe);color:#3A2800;
  font-weight:900;font-size:14px;cursor:pointer;flex:none}
.avatar-btn[aria-current="page"]{box-shadow:0 0 0 3px var(--cartao),0 0 0 5px var(--marca)}

.folha{max-width:1140px;margin:0 auto;padding:24px 20px 56px}
.cab-pag{margin-bottom:22px}
.cab-pag h1{font-size:30px;font-weight:900;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
.cab-pag p{color:var(--tinta-2);margin-top:4px;font-size:15.5px;max-width:60ch}
.rodape{margin-top:48px;font-size:12.5px;color:var(--tinta-3);text-align:center}

/* ---------- herói ---------- */
.heroi{background:var(--heroi);color:var(--heroi-tx);border-radius:28px;padding:30px 32px;position:relative;
  overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.heroi .ipe{position:absolute;right:-46px;top:-52px;width:240px;height:240px;opacity:.95;pointer-events:none}
.heroi .dia{font-size:14px;font-weight:700;color:var(--heroi-2)}
.heroi h1{font-size:40px;font-weight:900;letter-spacing:-.03em;line-height:1.05;margin-top:4px}
.heroi p{font-size:17px;margin-top:10px;max-width:46ch;color:var(--heroi-tx);opacity:.92}
.heroi p b{color:var(--ipe);font-weight:900}
.heroi-acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;position:relative}
.heroi-num{position:relative;background:rgba(255,255,255,.12);border-radius:20px;padding:16px 20px;
  display:grid;gap:2px;min-width:150px;backdrop-filter:blur(2px)}
.heroi-num strong{font-size:42px;font-weight:900;line-height:1;letter-spacing:-.03em}
.heroi-num span{font-size:13.5px;font-weight:700;color:var(--heroi-2)}

/* ---------- seções ---------- */
.sec{margin-top:36px}
.sec-topo{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec-topo h2{font-size:21px;font-weight:900;letter-spacing:-.02em}
.sec-topo .ct{font-size:13px;font-weight:900;background:var(--cartao-2);color:var(--tinta-2);
  border-radius:999px;padding:1px 9px}
.sec-topo .lk{margin-left:auto;font-size:14px;font-weight:800;color:var(--marca);background:none;border:0;
  cursor:pointer;padding:6px 8px;border-radius:999px;display:flex;align-items:center;gap:4px}
.sec-topo .lk:hover{background:var(--marca-suave)}
.rot{font-size:13.5px;font-weight:800;color:var(--tinta-2)}
.lede{font-size:15.5px;color:var(--tinta-2);max-width:62ch}

.grade{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* ---------- cartões ---------- */
.cartao{background:var(--cartao);border:0;border-radius:var(--r);padding:18px;display:flex;flex-direction:column;
  gap:9px;text-align:left;width:100%;font:inherit;color:inherit;box-shadow:var(--sombra);
  transition:transform .15s,box-shadow .15s}
button.cartao{cursor:pointer}
button.cartao:hover{transform:translateY(-2px);box-shadow:var(--sombra),0 0 0 2px var(--marca)}
.cartao h3{font-size:17px;font-weight:800;line-height:1.3;letter-spacing:-.01em;text-wrap:balance}
.cartao .meta{font-size:14px;color:var(--tinta-2)}
.cartao .pe{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;margin-top:auto;padding-top:10px}
.linha-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dado{font-size:13.5px;color:var(--tinta-2);font-weight:700;display:inline-flex;align-items:center;gap:5px}
.dado.forte{color:var(--tinta);font-weight:900}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:4px 10px;
  border-radius:999px;color:var(--tinta-2);background:var(--cartao-2);white-space:nowrap;line-height:1.25}
.chip.m{background:var(--marca-suave);color:var(--marca)}
.chip.i{background:var(--ipe-suave);color:var(--ipe-tinta)}
.chip.v{background:var(--ok-suave);color:var(--ok)}
.chip.a{background:var(--aviso-suave);color:var(--aviso)}
.chip.r{background:var(--erro-suave);color:var(--erro)}
.chip .pt{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;
  font-size:15px;font-weight:800;border:0;cursor:pointer;background:var(--cartao-2);color:var(--tinta);
  transition:background .15s,transform .1s;min-height:44px;text-decoration:none}
.btn:hover{background:var(--linha)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--marca);color:var(--sobre-marca)}
.btn.pri:hover{background:var(--marca-forte)}
.btn.claro{background:#FFFFFF;color:#1D2CA8}
.btn.claro:hover{background:var(--ipe);color:#3A2800}
.btn.vidro{background:rgba(255,255,255,.14);color:#FFFFFF}
.btn.vidro:hover{background:rgba(255,255,255,.24)}
.btn.fant{background:none;color:var(--tinta-2)}
.btn.fant:hover{background:var(--cartao-2);color:var(--tinta)}
.btn.peq{padding:7px 14px;font-size:13.5px;min-height:36px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.perigo{background:var(--erro-suave);color:var(--erro)}

/* ---------- compatibilidade (anel) ---------- */
.compat{display:inline-flex;align-items:center;gap:8px}
.anel{position:relative;display:inline-grid;place-items:center;flex:none}
.anel svg{position:absolute;inset:0}
.anel circle{fill:none;stroke-width:4.5}
.anel .trilho{stroke:var(--cartao-2)}
.anel .prog{stroke:var(--marca);stroke-linecap:round}
.anel.med .prog{stroke:var(--ipe)}
.anel.bai .prog{stroke:var(--tinta-3)}
.anel b{position:relative;font-size:11px;font-weight:900;letter-spacing:-.03em}
.compat-tx{display:flex;flex-direction:column;line-height:1.2}
.compat-tx b{font-size:14px;font-weight:900}
.compat-tx small{font-size:12.5px;color:var(--tinta-3);font-weight:700}
.req{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--linha)}
.req:last-child{border-bottom:0}
.req .mk{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900}
.req.ok .mk{background:var(--ok-suave);color:var(--ok)}
.req.nao .mk{background:var(--erro-suave);color:var(--erro)}
.req .tx{font-size:14.5px;line-height:1.4}
.req .tx b{font-weight:800}
.req .st{display:block;font-size:13.5px;color:var(--tinta-2);margin-top:1px}

/* ---------- busca e filtros ---------- */
/* Busca do herói: fica visível já na tela inicial, porque procurar vaga é a
   tarefa principal do estudante e ela não deve exigir navegar antes. */
.busca-heroi{display:flex;align-items:center;gap:10px;background:var(--cartao);border-radius:999px;
  padding:5px 6px 5px 18px;margin-top:18px;max-width:560px;position:relative;
  box-shadow:0 10px 28px rgba(21,23,58,.22);border:2px solid transparent;transition:border-color .15s}
.busca-heroi:focus-within{border-color:var(--ipe)}
.busca-heroi input{flex:1;border:0;background:none;padding:11px 0;outline:none;font-size:16px;
  min-width:0;color:var(--tinta)}
.busca-heroi input::placeholder{color:var(--tinta-3)}
.busca-heroi>svg{color:var(--tinta-3);flex:none}
.heroi .busca-dica{font-size:13.5px;font-weight:700;color:var(--heroi-2);margin-top:9px;
  min-height:20px;max-width:560px;opacity:1}
.atalhos{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.atalhos button{background:rgba(255,255,255,.16);color:#FFFFFF;border:0;border-radius:999px;
  padding:8px 15px;font-size:13.5px;font-weight:800;cursor:pointer;min-height:38px}
.atalhos button:hover{background:rgba(255,255,255,.3)}
.hub{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:start}
.busca{display:flex;align-items:center;gap:10px;background:var(--cartao);border-radius:999px;padding:0 8px 0 18px;
  box-shadow:var(--sombra);border:2px solid transparent;transition:border-color .15s}
.busca:focus-within{border-color:var(--marca)}
.busca input{flex:1;border:0;background:none;padding:13px 0;outline:none;font-size:15.5px;min-width:0}
.busca svg{color:var(--tinta-3);flex:none}
.busca .ico-btn{width:32px;height:32px}
.filtros{background:var(--cartao);border-radius:var(--r);padding:16px 16px;box-shadow:var(--sombra);
  position:sticky;top:84px}
.filtros-topo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px}
.filtros-topo .tog{display:none}
.fcorpo{display:flex;flex-direction:column;gap:16px;margin-top:14px}
.fgrupo{display:flex;flex-direction:column;gap:4px;border:0;padding:0;margin:0}
.fgrupo legend{padding:0;margin-bottom:6px}
.fop{display:flex;align-items:center;gap:10px;font-size:14.5px;cursor:pointer;padding:6px 8px;border-radius:10px;
  color:var(--tinta-2);min-height:36px;font-weight:600}
.fop:hover{background:var(--cartao-2);color:var(--tinta)}
.fop input{width:18px;height:18px;accent-color:var(--marca);cursor:pointer;flex:none;margin:0}
.fop .n{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--tinta-3)}
.fop:has(input:checked){color:var(--tinta);font-weight:800;background:var(--marca-suave)}
.resumo-busca{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:16px 0 12px}
.resumo-busca strong{font-size:16px;font-weight:900}
.resumo-busca span{font-size:13.5px;color:var(--tinta-3);font-weight:700}

/* ---------- eventos ---------- */
.ev{flex-direction:row;align-items:flex-start;gap:14px}
.ev-data{flex:none;width:58px;border-radius:14px;background:var(--marca-suave);color:var(--marca);text-align:center;
  padding:8px 0 7px;line-height:1}
.ev-data b{display:block;font-size:24px;font-weight:900;letter-spacing:-.02em}
.ev-data small{display:block;font-size:12px;font-weight:900;text-transform:uppercase;margin-top:3px;letter-spacing:.04em}
.ev-corpo{min-width:0;display:flex;flex-direction:column;gap:7px;flex:1}

/* ---------- lista ---------- */
.lista{display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;background:var(--cartao);box-shadow:var(--sombra)}
.item{display:flex;align-items:center;gap:14px;padding:15px 18px;border:0;border-bottom:1px solid var(--linha);
  width:100%;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:background .15s}
.item:last-child{border-bottom:0}
.item:hover{background:var(--cartao-2)}
.item .pr{min-width:0;flex:1}
.item .tt{font-size:15.5px;font-weight:800;line-height:1.3;margin-bottom:2px}
.item .sb{font-size:14px;color:var(--tinta-2)}
.item .sb.fraco{color:var(--tinta-3);font-size:13px;margin-top:3px}
.item .dr{display:flex;align-items:center;gap:10px;flex:none;color:var(--tinta-3)}
.item-ic{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center}
.nao-lida{width:9px;height:9px;border-radius:50%;background:var(--marca);flex:none}

/* ---------- folha de detalhe ---------- */
.veu{position:fixed;inset:0;background:var(--veu);z-index:50;animation:surge .18s ease-out}
@keyframes surge{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(560px,calc(100% - 24px));background:var(--cartao);
  z-index:51;display:flex;flex-direction:column;box-shadow:var(--sombra-forte);border-radius:26px;overflow:hidden;
  animation:desliza .24s cubic-bezier(.2,.8,.3,1)}
@keyframes desliza{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
.drawer-topo{padding:20px 22px 14px;display:flex;align-items:flex-start;gap:12px}
.drawer-topo h2{font-size:22px;font-weight:900;line-height:1.2;letter-spacing:-.02em;text-wrap:balance}
.drawer-topo .ante{font-size:13.5px;font-weight:800;color:var(--marca)}
.drawer-corpo{padding:6px 22px 22px;overflow-y:auto;flex:1}
.drawer-pe{padding:14px 22px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--linha);
  display:flex;gap:10px;align-items:center;background:var(--cartao)}
.alca{display:none}
.bloco{margin-bottom:22px}
.bloco>.rot{display:block;margin-bottom:8px;font-size:15px;color:var(--tinta);font-weight:900}
.bloco p{font-size:15px;color:var(--tinta-2);line-height:1.6}
.caixa{background:var(--fundo);border-radius:var(--r-m);padding:4px 16px}
.pares{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.par{background:var(--fundo);border-radius:var(--r-m);padding:11px 13px}
.par dt{font-size:12.5px;color:var(--tinta-3);font-weight:800;margin-bottom:1px}
.par dd{margin:0;font-size:17px;font-weight:900;letter-spacing:-.01em}
.par dd small{font-size:12px;font-weight:700;color:var(--tinta-3)}
.par dd.tx{font-size:14.5px;font-weight:800}
.pessoa{display:flex;align-items:center;gap:12px;background:var(--fundo);border-radius:var(--r-m);padding:12px 14px}
.pessoa .perfil-av{width:44px;height:44px;font-size:15px}

/* Uma única regra de busca, usada na tela inicial e na tela de vagas, para que o
   mesmo termo devolva sempre o mesmo resultado nos dois lugares. */
function casaBusca(o,q){
  if(!q)return true;
  return (o.tit+' '+o.desc+' '+o.areas.join(' ')+' '+o.conhec.join(' ')+' '+o.prog+' '+o.tipo+' '+
    doc(o.orient).nome+' '+INST[o.inst]).toLowerCase().includes(q);
}
const HOJE=new Date('2026-09-29T12:00:00');
function dt(iso){const [a,m,d]=iso.split('-');return d+'/'+m+'/'+a;}
function dtCurto(iso){const [a,m,d]=iso.split('-');return d+'/'+m;}
function diasAte(iso){return Math.round((new Date(iso+'T12:00:00')-HOJE)/864e5);}
function iniciais(n){return n.split(' ').filter(p=>p.length>2).slice(0,2)
  .map(p=>p[0]).join('').toUpperCase();}
function moeda(v){return 'R$ '+v.toLocaleString('pt-BR');}
function plural(n,s,p){return n+' '+(n===1?s:p);}

/* Compatibilidade: transparente e auditável: cada requisito vira uma linha
   com atendido/não atendido, e o percentual é a média ponderada deles. */
function compat(o,e){
  const itens=[];
  const cursoOk=o.cursos.includes(e.curso);
  itens.push({ok:cursoOk,peso:3,rot:'Curso',
    det:cursoOk?e.curso:'A vaga aceita '+o.cursos.join(', ')+'. Seu curso é '+e.curso+'.'});
  const perOk=e.periodo>=o.perMin;
  itens.push({ok:perOk,peso:2,rot:'Período mínimo: '+o.perMin+'º',
    det:'Você está no '+e.periodo+'º período.'});
  const mgOk=e.mg>=o.mgMin;
  itens.push({ok:mgOk,peso:2,rot:'Média global mínima: '+fmt1(o.mgMin),
    det:'Sua média global é '+fmt1(e.mg)+'.'});
  const meus=(e.interesses||[]).map(s=>s.toLowerCase());
  const casam=o.areas.filter(a=>meus.some(m=>m.includes(a.toLowerCase())||a.toLowerCase().includes(m)));
  const areaOk=casam.length>0;
  itens.push({ok:areaOk,peso:3,rot:'Áreas de interesse',
    det:areaOk?'Coincide com '+casam.join(', ')+'.':'Nenhuma das suas áreas coincide com '+o.areas.join(', ')+'.'});
  const hab=(e.habil||[]).map(s=>s.toLowerCase());
  const temC=o.conhec.filter(c=>hab.some(h=>h.includes(c.toLowerCase())||c.toLowerCase().includes(h)));
  const conhecOk=temC.length>=Math.ceil(o.conhec.length/2);
  itens.push({ok:conhecOk,peso:2,rot:'Conhecimentos desejados',
    det:temC.length?'Você declara '+temC.join(', ')+'.':'Você não declarou nenhum dos conhecimentos pedidos.'});
  const tot=itens.reduce((s,i)=>s+i.peso,0);
  const pt=itens.reduce((s,i)=>s+(i.ok?i.peso:0),0);
  const pc=Math.round(pt/tot*100);
  const bloq=itens.filter(i=>!i.ok&&i.peso>=2&&(i.rot==='Curso'||i.rot.indexOf('Média global')===0));
  return {pc,itens,eleg:bloq.length===0,bloq};
}
function nivel(pc){return pc>=75?'':pc>=50?'med':'bai';}

/* Resposta imediata ao que foi digitado, antes de trocar de tela: o estudante vê
   se vale a pena seguir sem perder o lugar onde está. */
function dicaBusca(q){
  q=(q||'').trim();
  if(!q)return 'Procure por área, professor, programa ou palavra-chave. Aperte Enter para abrir a lista.';
  const c=S.ops.filter(o=>o.status!=='encerrada'&&casaBusca(o,q.toLowerCase())).length;
  return c? (c===1?'1 vaga aberta combina':c+' vagas abertas combinam')+' com “'+q+'”. Aperte Enter para ver.'
          : 'Nenhuma vaga aberta com “'+q+'”. Tente um termo mais geral.';
}

  if(o.status==='encerrando'||d<=7) return '<span class="chip a"><span class="pt"></span>'+
    (d<=0?'Fecha hoje':d===1?'Fecha amanhã':'Faltam '+d+' dias')+'</span>';
  return '<span class="chip v"><span class="pt"></span>Aberta</span>';
}

function anel(pc,s){
  s=s||40;const r=(s-5)/2,c=2*Math.PI*r,h=s/2;
  return '<span class="anel '+nivel(pc)+'" style="width:'+s+'px;height:'+s+'px" aria-hidden="true">'+
    '<svg viewBox="0 0 '+s+' '+s+'" width="'+s+'" height="'+s+'">'+
    '<circle class="trilho" cx="'+h+'" cy="'+h+'" r="'+r+'"/>'+
    '<circle class="prog" cx="'+h+'" cy="'+h+'" r="'+r+'" stroke-dasharray="'+(c*pc/100).toFixed(1)+' '+c.toFixed(1)+'" '+
      'transform="rotate(-90 '+h+' '+h+')"/></svg><b>'+pc+'</b></span>';
}

function telaOportunidades(){
  const e=est(S.eu), F=S.filtros;

  let lista=S.ops.filter(o=>{
    if(F.tipo.length&&!F.tipo.includes(o.tipo))return false;
    if(F.bolsa.length&&!F.bolsa.includes(o.bolsa?'Bolsista':'Voluntário'))return false;
    if(F.inst.length&&!F.inst.includes(o.inst))return false;
    if(F.status.length&&!F.status.includes(statusDe(o)))return false;
    if(!casaBusca(o,q))return false;

  lista=lista.map(o=>({o,c:compat(o,e)})).sort((a,b)=>b.c.pc-a.c.pc);
  const idsMeus=S.cands.filter(c=>c.est===S.eu).map(c=>c.op);
  const nFiltros=F.tipo.length+F.bolsa.length+F.inst.length+F.status.length;
  const conta=(campo,val)=>S.ops.filter(o=>{
    if(campo==='tipo')return o.tipo===val;
    if(campo==='bolsa')return (o.bolsa?'Bolsista':'Voluntário')===val;

      'value="'+esc(v)+'"'+(F[campo].includes(v)?' checked':'')+'>'+
      '<span>'+esc(rots?rots[i]:v)+'</span><span class="n">'+conta(campo,v)+'</span></label>').join('')+'</fieldset>';

  return cab('Vagas','Iniciação científica, extensão, monitoria e TCC. As que mais combinam com você aparecem primeiro.')+
    '<div class="hub">'+
    '<aside class="filtros'+(S.fAberto?' aberto':'')+'" aria-label="Filtros">'+
      '<div class="filtros-topo">'+ico('fltr',18)+'<span>Filtros</span>'+

        '<button class="btn fant peq tog" data-ac="togFiltros" aria-expanded="'+S.fAberto+'">'+
          (S.fAberto?'Esconder':'Mostrar')+'</button></div>'+
      '<div class="fcorpo">'+
      grupo('Tipo','tipo',['Iniciação Científica','Extensão','Monitoria','TCC'])+
      grupo('Bolsa','bolsa',['Bolsista','Voluntário'],['Com bolsa','Voluntária'])+
      grupo('Unidade','inst',['INF','IME','EEC','IF'],['Informática','Matemática e Estatística','Engenharia Civil e Ambiental','Física'])+
      grupo('Inscrições','status',['Abertas','Fechando em breve','Encerrada'],['Abertas','Fechando em breve','Encerradas'])+
      (nFiltros?'<button class="btn peq" data-ac="limparF">Limpar filtros</button>':'')+
      '</div></aside>'+
    '<div style="min-width:0">'+
      '<div class="busca">'+ico('lupa',19)+
        '<label class="sr" for="bq">Buscar vaga</label>'+
        '<input id="bq" type="text" placeholder="Busque por área, professor ou assunto" value="'+esc(S.q)+'" data-ac="busca" autocomplete="off">'+
        (S.q?'<button class="ico-btn" data-ac="limparQ" aria-label="Limpar busca">'+ico('fech',15)+'</button>':'')+'</div>'+
      '<div class="resumo-busca"><strong>'+

function erroDe(k){const F=S.form,r=REGRAS[k];if(!r||!F.tocado[k])return null;return r.val(F.dados[k],F.dados);}

function campo(k,corpo,aj){
  const e=erroDe(k);

    (aj?'<p class="aj" id="aj_'+k+'">'+esc(aj)+'</p>':'')+
    corpo.replace('%ARIA%','aria-invalid="'+(e?'true':'false')+'"'+(e?' aria-describedby="er_'+k+'"':aj?' aria-describedby="aj_'+k+'"':''))+
    (e?'<p class="msg-erro" id="er_'+k+'">'+ico('aler',15)+'<span>'+esc(e)+'</span></p>':'')+'</div>';

      (D.bolsa==='sim'?campo('valor',inp('valor','number','min="1" step="50" placeholder="700"'),'Valor mensal em reais.'):'')+
      '<div class="dupla">'+campo('ch',inp('ch','number','min="4" max="30" step="1" placeholder="20"'),'De 4 a 30 horas.')+
      campo('vagas',inp('vagas','number','min="1" max="20" step="1" placeholder="2"'))+'</div>'+
      campo('prazo',inp('prazo','date','min="2026-09-30"'),'A partir de amanhã.');
  } else {
    const falta=[0,1,2].filter(i=>!passoValido(i));

      '<span class="rot">Como o card vai aparecer</span>'+

        '<div class="meta">Prof. Dr. João Silva · Informática</div>'+
        '<div class="pe"><span class="dado forte">'+
          (D.bolsa==='sim'?(D.valor?moeda(+D.valor)+'/mês':'Bolsa sem valor'):D.bolsa==='nao'?'Voluntária':'Bolsa não definida')+'</span>'+

        ['tit','tipo','cursos','perMin','mgMin','ch','vagas','prazo'].map(k=>{

          if(k==='mgMin'&&v!==''&&v!=null)v=fmt1(v);

          return '<div class="par"><dt>'+esc(REGRAS[k].rot)+'</dt><dd class="'+(['tit','tipo','cursos'].includes(k)?'tx':'')+'"'+

    '<div class="form-caixa">'+corpo+'</div>'+

      '<div style="margin-left:auto">'+

        '<button class="btn pri" data-ac="publicar">'+ico('chek',16)+' Publicar vaga</button>')+

function anotsVisiveis(){
  return ANOTACOES.filter(a=>{
    if(a.papel&&a.papel!==S.papel)return false;
    if(a.drawer)return !!(S.drawer&&S.drawer.t===a.drawer);
    if(a.rota)return !S.drawer&&a.rota===S.rota;
    return false;
  });
}
function pintarMarcadores(){
  const velha=$('#camadaAnot'); if(velha)velha.remove();
  if(!S.anotar)return;
  document.querySelectorAll('.tem-anot').forEach(e=>e.classList.remove('tem-anot'));
  const camada=document.createElement('div');
  camada.className='camada-anot'; camada.id='camadaAnot';
  camada.style.zIndex=S.drawer?60:45;   // a folha lateral está em 51
  document.body.appendChild(camada);
  anotsVisiveis().forEach(a=>{
    const alvo=document.querySelectorAll(a.sel)[a.i||0];
    if(!alvo)return;
    alvo.classList.add('tem-anot');
    const r=alvo.getBoundingClientRect();
    const m=document.createElement('button');
    m.type='button'; m.className='marcador';
    m.dataset.ac='verAnot'; m.dataset.n=a.n;
    m.textContent=a.n;
    m.setAttribute('aria-label','Anotação '+a.n+': '+a.nome+'. '+a.cat+'.');
    m.style.left=(r.left+window.scrollX-13)+'px';
    m.style.top=(r.top+window.scrollY-13)+'px';
    camada.appendChild(m);
  });
}

window.addEventListener('resize',()=>{clearTimeout(_ra);_ra=setTimeout(pintarMarcadores,160);});

function toast(tx,tipo,desf){
  const el=document.createElement('div');
  el.className='toast'+(tipo?' '+tipo:'');
  el.innerHTML=ico(tipo==='erro'?'aler':tipo==='ok'?'chek':'info',18)+'<span>'+esc(tx)+'</span>'+
    (desf?'<button class="desf" data-ac="desfazer">Desfazer</button>':'');
  $('#torre').appendChild(el);
  if(desf)S.desfazer=desf;
  setTimeout(()=>{el.style.transition='opacity .2s';el.style.opacity='0';
    setTimeout(()=>el.remove(),220);if(S.desfazer===desf)S.desfazer=null;},desf?6500:3600);
}

  if(i===4){c.res='nao';c.etapa=3;}
  else if(i===3){c.res='sim';c.etapa=3;}

  novaOp(){S.papel='docente';S.rota='novaop';S.form={passo:0,dados:{},erros:{},tocado:{}};S.drawer=null;render();window.scrollTo(0,0);},

  irPasso(el){const p=+el.dataset.p;

    if(falta!=null){S.form.passo=falta;render();toast('Ainda não dá para publicar. Veja os campos marcados.','erro');return;}
    const D=S.form.dados;
    const nova={id:'o'+(Date.now()%100000),tit:D.tit.trim(),tipo:D.tipo,
      prog:D.tipo==='Iniciação Científica'?(D.bolsa==='sim'?'PIBIC':'PIVIC'):

    if(para<0||para>4)return;
    const de=colDe(c),antes={etapa:c.etapa,res:c.res};
    aplicarCol(c,para);render();movido(c,para,de,antes);},
  moverSel(el){
    const c=S.cands.find(x=>x.id===el.dataset.cid),para=+el.value;
    const de=colDe(c),antes={etapa:c.etapa,res:c.res};
    aplicarCol(c,para);S.drawer=null;render();movido(c,para,de,antes);},
  desfazer(){if(S.desfazer){const f=S.desfazer;S.desfazer=null;f();}},
  quadroDe(el){S.quadroOp=el.dataset.id;S.rota='candidatos';S.drawer=null;render();window.scrollTo(0,0);}
};
/* ============================================================
   Eventos: delegação única na raiz
   ============================================================ */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-ac]');
  if(!el)return;
  const ac=el.dataset.ac;
  if(el.tagName==='INPUT'||el.tagName==='SELECT')return;
  if(!ACOES[ac])return;
  ev.preventDefault();
  ACOES[ac](el);
});
document.addEventListener('input',ev=>{
  const el=ev.target.closest('[data-ac]');if(!el)return;
  if(el.dataset.ac==='buscaInicio'){
    /* Atualiza só a linha de resposta. Sem render, o cursor não salta. */
    S.q=el.value;
    const d=document.getElementById('bdica');
    if(d)d.textContent=dicaBusca(S.q);
    return;
  }
  if(el.dataset.ac==='busca'){
    S.q=el.value;S.carregando=true;render();
    clearTimeout(window._bt);
    window._bt=setTimeout(()=>{S.carregando=false;render();
      const i=$('#bq');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},280);
  }
  if(el.dataset.ac==='fcampo'){
    const k=el.dataset.k;
    S.form.dados[k]=el.type==='radio'?el.value:el.value;
    if(S.form.tocado[k]||el.type==='radio'||el.tagName==='SELECT'){
      S.form.tocado[k]=true;
      const pos=el.selectionStart;render();
      const n=document.getElementById('f_'+k);
      if(n&&n.focus){n.focus();if(pos!=null&&n.setSelectionRange)try{n.setSelectionRange(pos,pos)}catch(e){}}
    }
  }
});
document.addEventListener('change',ev=>{
  const el=ev.target.closest('[data-ac]');if(!el)return;
  const ac=el.dataset.ac;
  if(ac==='filtro'){
    const c=el.dataset.c, v=el.value, arr=S.filtros[c];
    const i=arr.indexOf(v);
    if(el.checked&&i<0)arr.push(v); else if(!el.checked&&i>=0)arr.splice(i,1);
    render();
  }
  if(ac==='trocaQuadro')ACOES.trocaQuadro(el);
  if(ac==='moverSel')ACOES.moverSel(el);
  if(ac==='fcampo'){
    const k=el.dataset.k;S.form.tocado[k]=true;S.form.dados[k]=el.value;render();
  }
});
document.addEventListener('blur',ev=>{
  const el=ev.target.closest?ev.target.closest('[data-ac="fcampo"]'):null;
  if(!el)return;
  const k=el.dataset.k;
  if(!S.form.tocado[k]){S.form.tocado[k]=true;S.form.dados[k]=el.value;render();}
},true);
document.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'&&ev.target&&ev.target.id==='bqi'){
    ev.preventDefault();S.q=ev.target.value;ACOES.ir({dataset:{r:'oportunidades'}});return;
  }
  if(ev.key==='Escape'){
    if(S.drawer){S.drawer=null;render();}
    else if(S.menu){S.menu=false;render();}
  }
  if(ev.key==='Tab'&&S.drawer){
    const d=$('#drawer');if(!d)return;
    const f=d.querySelectorAll('button,select,a[href],input,textarea,[tabindex]:not([tabindex="-1"])');
    if(!f.length)return;
    const pri=f[0], ult=f[f.length-1];
    if(ev.shiftKey&&document.activeElement===pri){ev.preventDefault();ult.focus();}
    else if(!ev.shiftKey&&document.activeElement===ult){ev.preventDefault();pri.focus();}
  }
});
/* arrastar e soltar no quadro de candidatos */
let arrastando=null;
document.addEventListener('dragstart',ev=>{
  const c=ev.target.closest&&ev.target.closest('.cand');if(!c)return;
  arrastando=c.dataset.cid;c.classList.add('arrastando');
  ev.dataTransfer.effectAllowed='move';
  try{ev.dataTransfer.setData('text/plain',arrastando)}catch(e){}
});
document.addEventListener('dragend',()=>{
  arrastando=null;
  document.querySelectorAll('.arrastando,.alvo').forEach(x=>x.classList.remove('arrastando','alvo'));
});
document.addEventListener('dragover',ev=>{
  const col=ev.target.closest&&ev.target.closest('.coluna');if(!col||!arrastando)return;
  ev.preventDefault();ev.dataTransfer.dropEffect='move';
  document.querySelectorAll('.alvo').forEach(x=>x.classList.remove('alvo'));
  col.classList.add('alvo');
});
document.addEventListener('drop',ev=>{
  const col=ev.target.closest&&ev.target.closest('.coluna');if(!col||!arrastando)return;
  ev.preventDefault();
  const c=S.cands.find(x=>x.id===arrastando);
  const para=+col.dataset.col, de=colDe(c);
  arrastando=null;
  if(de===para){render();return;}
  const antes={etapa:c.etapa,res:c.res};
  aplicarCol(c,para);render();movido(c,para,de,antes);
});
window.addEventListener('hashchange',()=>{
  const h=location.hash.replace('#','');
  const todas=ROTAS[S.papel].map(x=>x.r);
  if(todas.includes(h)&&h!==S.rota){S.rota=h;S.drawer=null;render();}
});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(S.tema===null)render();});

/* início */
const hIni=location.hash.replace('#','');
if(ROTAS.estudante.some(x=>x.r===hIni))S.rota=hIni;
render();
</script>
